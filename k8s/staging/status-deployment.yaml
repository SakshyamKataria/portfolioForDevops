apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-status
  namespace: staging
  labels:
    app: portfolio-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-status
  template:
    metadata:
      labels:
        app: portfolio-status
    spec:
      containers:
        - name: status
          image: portfolio-status-api:local # Placeholder, replaced by Jenkins
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: BUILD_NUMBER
              value: "local-dev" # Placeholder
            - name: GIT_COMMIT
              value: "unknown" # Placeholder
            - name: PORT
              value: "3001"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 5
