name: React CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build React App
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload Build to S3
        run: aws s3 sync build/ s3://sakshyam-portfolio-artifacts --delete

      - name: Setup SSH
        run: |
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > private_key.pem
          chmod 600 private_key.pem
          ssh-keygen -y -f private_key.pem > /dev/null

      - name: Test SSH connection to EC2
        run: |
          ssh -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o StrictHostKeyChecking=no \
              -i private_key.pem \
              ubuntu@${{ secrets.EC2_HOST }} \
              'echo ssh_ok'

      - name: Deploy to EC2
        run: |
          ssh -tt \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=40 \
              -o StrictHostKeyChecking=no \
              -i private_key.pem \
              ubuntu@${{ secrets.EC2_HOST }} \
              'sudo -n bash /home/ubuntu/deploy.sh'
